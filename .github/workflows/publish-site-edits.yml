name: Publish GUMAPS website edits
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply-update:
    if: ${{ contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Apply validated website update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/apply-website-update.js
